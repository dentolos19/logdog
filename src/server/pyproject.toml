[project]
name = "logdog-server"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.20.0",
  "bcrypt",
  "boto3>=1.43.108",
  "chardet",
  "drain3",
  "fastapi[standard]",
  "langchain-openrouter",
  "openpyxl",
  "psycopg[binary]",
  "pydantic>=2.14.1,<3",
  "python-docx",
  "python-dotenv",
  "pyjwt[crypto]>=2.15.1,<3",
  "pyyaml",
  "sqlalchemy",
  "sqlparse",
  "uvicorn",
]

[dependency-groups]
dev = ["ruff", "ty"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Form"]
