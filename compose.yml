services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: main
      POSTGRES_PASSWORD: logdog
      POSTGRES_USER: logdog
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U logdog -d main" ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./src/server/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  postgres:
